apiVersion: apps/v1
kind: Deployment
metadata:
  name: just-fire-service-deployment
  labels:
    app: just-fire-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: just-fire-service
  template:
    metadata:
      labels:
        app: just-fire-service
    spec:
      containers:
        - name: just-fire-service
          image: just-fire-microservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_OPTS
              value: "-Xms4096m -Xmx4096m -XX:MaxNewSize=1536m -XX:MaxMetaspaceSize=768m -XX:MetaspaceSize=768m -XX:NewSize=1536m"
          command: ["sh", "-c"]
          args: ["java $JAVA_OPTS -jar /app.jar"]
          resources:
            requests:
              cpu: 1000m # was 2
              memory: 4096Mi
            limits:
              cpu: 1000m # was 4
              memory: 4096Mi
          envFrom:
            - secretRef:
                name: just-fire-service-secrets