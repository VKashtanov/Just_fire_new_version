apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: just-fire-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: just-fire-service-deployment # must be related to deployment
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # upon 70% adds a pode